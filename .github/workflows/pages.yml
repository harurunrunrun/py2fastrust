name: browser converter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Match the Python patch release in pinned Pyodide 314.0.7 for parity.
          python-version: '3.14.2'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.85.0'
      - run: python -m pip install 'setuptools==78.1.1' 'wheel==0.46.3'
      - run: python -m unittest discover -s tests/web -p 'test_*.py' -v
      - run: node tests/web/ui.test.mjs
      - run: node tests/web/worker.test.mjs
      - run: python tools/build_web.py --output dist/web
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/web/browser.mjs --site dist/web --source . --artifacts dist/browser-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-verification
          path: dist/browser-test
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
