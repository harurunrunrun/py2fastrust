name: tests
on: [push, pull_request]
jobs:
  test:
    # setup-python publishes the pinned 3.14.x patch builds for 22.04/24.04;
    # ubuntu-latest moved to 26.04, where 3.14.2-3.14.5 are not available.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        config:
          - rust: '1.85.0'
            python: '3.14'
          - rust: stable
            python: '3.14'
          - rust: stable
            python: '3.14.4'
        # Test modules are split across shards (tools/run_tests.py) and each
        # shard runs its modules in parallel processes.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    name: test (${{ matrix.config.rust }}, ${{ matrix.config.python }}, shard ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.config.python }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ matrix.config.rust }}
      - run: python -m pip install .
      - run: pytors --version
      - run: pytors --list-licenses
      - run: python tools/run_tests.py --shard ${{ matrix.shard }} --shards 8 --jobs 4
      - if: matrix.shard == 0
        run: python tools/check_standalone.py
