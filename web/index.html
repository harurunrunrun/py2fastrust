<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Convert Python source to Rust in your browser with pytors.">
  <title>pytors — Python to Rust</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header>
    <h1>pytors</h1>
    <p>Python to Rust</p>
  </header>
  <main>
    <form id="converter" aria-label="Python to Rust converter">
      <hr>
      <div class="controls">
        <label for="integer">Integer:
          <select id="integer" name="integer" aria-describedby="options-note" disabled>
            <option value="i64">i64</option>
          </select>
        </label>
        <label for="string-mode">Strings:
          <select id="string-mode" name="string_mode" aria-describedby="options-note" disabled>
            <option value="ascii">ASCII</option>
            <option value="unicode">Unicode</option>
          </select>
        </label>
        <label for="license">License:
          <select id="license" name="license" aria-describedby="options-note" disabled>
            <option value="CC0-1.0">CC0-1.0</option>
          </select>
        </label>
        <label class="optimization" for="optimize">
          <input id="optimize" name="optimize" type="checkbox" aria-describedby="options-note" checked disabled>
          Optimize
        </label>
        <div class="actions">
          <button id="convert" type="submit" disabled>Convert</button>
          <button id="cancel" type="button" hidden>Cancel</button>
          <button id="retry" type="button" hidden>Retry loading</button>
        </div>
      </div>
      <p class="note" id="options-note">Leading source directives override these options.</p>
      <hr>
      <div class="editors" id="editors" aria-busy="true">
        <div class="editor">
          <label for="source">Python source</label>
          <textarea id="source" name="source" rows="28" cols="60" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-describedby="source-note">print(1 + 2)
</textarea>
          <p class="note" id="source-note">Single file: main.py. Ctrl+Enter or Command+Enter to convert.</p>
        </div>
        <div class="editor">
          <label for="output">Rust output</label>
          <textarea id="output" rows="28" cols="60" readonly spellcheck="false" wrap="off" placeholder="Rust source will appear here." aria-describedby="output-note"></textarea>
          <p class="note" id="output-note">Generated Rust source is read-only.</p>
        </div>
      </div>
      <div class="messages">
        <p id="status" role="status" aria-live="polite" aria-atomic="true">Loading Python…</p>
        <section id="diagnostics" aria-labelledby="diagnostics-heading" hidden>
          <h2 id="diagnostics-heading">Diagnostics</h2>
          <ul id="diagnostic-list"></ul>
        </section>
      </div>
    </form>
    <noscript><p>JavaScript is required to run the converter in your browser.</p></noscript>
  </main>
  <footer>
    <hr>
    <p><a href="https://github.com/harurunrunrun/py2fastrust">Source repository</a></p>
  </footer>
</body>
</html>
